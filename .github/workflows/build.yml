name: Build

on:
    pull_request:
    push:
        branches:
            - main
            - master
        paths:
            - VERSION
            - package.json
            - package-lock.json
            - .github/workflows/build.yml

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Read release version
              id: version
              shell: pwsh
              run: |
                  $version = (Get-Content VERSION -Raw).Trim()
                  $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

                  if ([string]::IsNullOrWhiteSpace($version)) {
                    throw "VERSION is empty."
                  }

                  if ($version -ne $packageVersion) {
                    throw "VERSION ($version) must match package.json version ($packageVersion)."
                  }

                  "version=$version" >> $env:GITHUB_OUTPUT
                  "tag=v$version" >> $env:GITHUB_OUTPUT

            - name: Prepare release notes
              if: github.event_name == 'push'
              shell: pwsh
              run: |
                  $version = "${{ steps.version.outputs.version }}"
                  $changelog = Get-Content CHANGELOG.md -Raw
                  $escapedVersion = [regex]::Escape($version)
                  $match = [regex]::Match($changelog, "(?s)## \[$escapedVersion\][^\r\n]*(.*?)(?=\r?\n## \[|$)")

                  if ($match.Success) {
                    $notes = $match.Groups[1].Value.Trim()
                  } else {
                    $notes = "Release v$version"
                  }

                  Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

            - name: Check
              run: npm run check

            - name: Build
              run: npx electron-vite build

            - name: Package
              if: github.event_name == 'push'
              run: npx electron-builder --win --publish never

            - name: Publish GitHub release
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: Release ${{ steps.version.outputs.tag }}
                  body_path: release-notes.md
                  make_latest: true
                  fail_on_unmatched_files: false
                  files: |
                      release/*.exe
                      release/*.exe.blockmap
                      release/latest.yml

            - name: Upload artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: launcher-build
                  path: |
                      out/**
                      release/**
                  if-no-files-found: ignore
